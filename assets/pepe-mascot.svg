<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" role="img" aria-label="Linh vật Ếch Pepe đang cày cuốc kiếm tiền nuôi thân">
  <defs>
    <linearGradient id="pepeSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="pepeLip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="screenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Mascot Frame Background -->
  <rect x="3" y="3" width="154" height="154" rx="28" fill="#0b131e" stroke="#22c55e" stroke-width="2.5"/>

  <!-- Animated Bobbing Container -->
  <g class="mascot-bob">
    <!-- Pepe Head & Torso -->
    <path d="M 40 76 C 30 62 46 42 62 42 C 72 42 78 48 80 50 C 82 48 88 42 98 42 C 114 42 130 62 120 76 C 126 90 120 110 106 116 C 94 121 66 121 54 116 C 40 110 34 90 40 76 Z" fill="url(#pepeSkin)" stroke="#14532d" stroke-width="2.5"/>

    <!-- Large Droopy Eyes Outer -->
    <ellipse cx="60" cy="46" rx="14" ry="16" fill="#f8fafc" stroke="#14532d" stroke-width="2.5"/>
    <ellipse cx="100" cy="46" rx="14" ry="16" fill="#f8fafc" stroke="#14532d" stroke-width="2.5"/>

    <!-- Eyelids / Brow line -->
    <path d="M 45 42 Q 60 38 75 44" stroke="#14532d" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 85 44 Q 100 38 115 42" stroke="#14532d" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Pupils with Blinking Animation -->
    <g class="mascot-blink">
      <!-- Left Eye Pupil -->
      <ellipse cx="61" cy="48" rx="6.5" ry="8" fill="#854d0e"/>
      <ellipse cx="61.5" cy="48.5" rx="4" ry="5.5" fill="#09090b"/>
      <circle cx="59" cy="45" r="2.2" fill="#ffffff"/>
      <circle cx="63" cy="51" r="1.2" fill="#ffffff"/>

      <!-- Right Eye Pupil -->
      <ellipse cx="99" cy="48" rx="6.5" ry="8" fill="#854d0e"/>
      <ellipse cx="98.5" cy="48.5" rx="4" ry="5.5" fill="#09090b"/>
      <circle cx="97" cy="45" r="2.2" fill="#ffffff"/>
      <circle cx="101" cy="51" r="1.2" fill="#ffffff"/>
    </g>

    <!-- Red Determination Bandana: "NUÔI THÂN" -->
    <path d="M 42 36 Q 80 31 118 36 L 119 43 Q 80 38 41 43 Z" fill="#ef4444"/>
    <text x="80" y="41" font-size="6.5" font-weight="900" fill="#ffffff" text-anchor="middle" font-family="system-ui,sans-serif" letter-spacing="1">NUÔI THÂN</text>
    <!-- Bandana knot -->
    <path d="M 117 38 L 126 34 L 124 42 Z" fill="#dc2626"/>

    <!-- Iconic Pepe Curved Lips -->
    <!-- Upper lip contour -->
    <path d="M 44 80 Q 80 84 116 80 Q 110 93 80 95 Q 50 93 44 80 Z" fill="url(#pepeLip)" stroke="#14532d" stroke-width="2"/>
    <!-- Mouth line -->
    <path d="M 46 83 Q 80 88 114 83" stroke="#14532d" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- Lower lip -->
    <path d="M 54 93 Q 80 102 106 93 Q 80 97 54 93 Z" fill="#15803d"/>

    <!-- Blush / Cute Hard Work Glow -->
    <ellipse cx="44" cy="74" rx="5" ry="3" fill="#f87171" opacity="0.6"/>
    <ellipse cx="116" cy="74" rx="5" ry="3" fill="#f87171" opacity="0.6"/>

    <!-- Sparkling Tear Drop / Sweat of hard work -->
    <g class="mascot-twinkle">
      <path d="M 113 58 C 115 55 118 58 117 61 C 116 63 114 63 113 61 Z" fill="#38bdf8" opacity="0.95"/>
      <circle cx="128" cy="24" r="5" fill="#facc15" opacity="0.8"/>
      <path d="M 128 20 L 129 23 L 132 24 L 129 25 L 128 28 L 127 25 L 124 24 L 127 23 Z" fill="#fffbeb"/>
    </g>

    <!-- Laptop In Front Of Pepe -->
    <rect x="42" y="112" width="76" height="32" rx="4" fill="url(#laptopGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="46" y="115" width="68" height="22" rx="2" fill="#020617"/>
    <!-- Matrix Code Glowing on Screen -->
    <path d="M 50 120 L 66 120 M 50 124 L 78 124 M 50 128 L 62 128 M 50 132 L 72 132" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" filter="url(#screenGlow)"/>
    <!-- Mac / Pepe Glowing Logo -->
    <circle cx="80" cy="126" r="3" fill="#22c55e" opacity="0.85"/>

    <!-- Typing Frog Hands with Typing Animation -->
    <g class="mascot-wave">
      <ellipse cx="48" cy="126" rx="6" ry="4" fill="#4ade80" stroke="#14532d" stroke-width="1.2"/>
    </g>
    <g class="mascot-wave" style="animation-delay: 0.35s;">
      <ellipse cx="112" cy="126" rx="6" ry="4" fill="#4ade80" stroke="#14532d" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Tag Label at bottom -->
  <text x="80" y="153" text-anchor="middle" font-size="10.5" font-weight="900" fill="#22c55e" font-family="system-ui,-apple-system,sans-serif" letter-spacing="0.8">PEPE NUÔI THÂN</text>
</svg>
