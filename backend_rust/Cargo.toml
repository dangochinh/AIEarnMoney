[package]
name = "talentscout-backend"
version = "1.2.0"
edition = "2021"
authors = ["Pepe Nuôi Thân Tech Labs <pepe@ai-earn-money.pages.dev>"]
description = "High-performance Rust backend for TalentScout AI LinkedIn Candidate Harvester & REST API Server"

[[bin]]
name = "talentscout-server"
path = "src/main.rs"

[[bin]]
name = "talentscout-cli"
path = "src/bin/cli.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
